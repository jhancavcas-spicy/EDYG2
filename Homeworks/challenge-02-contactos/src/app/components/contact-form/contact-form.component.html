<section class="form-section">
  <h2>Agregar contacto</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="contact-form" novalidate>
    <div class="form-group">
      <label for="name">Nombre</label>
      <input
        id="name"
        type="text"
        formControlName="name"
        placeholder="Ej: Laura Gómez"
        class="form-input"
        [class.invalid]="nameControl?.invalid && nameControl?.touched">
      <span class="error-msg" *ngIf="nameControl?.invalid && nameControl?.touched">
        El nombre es obligatorio (mínimo 2 caracteres).
      </span>
    </div>

    <div class="form-group">
      <label for="phone">Teléfono</label>
      <input
        id="phone"
        type="tel"
        formControlName="phone"
        placeholder="Ej: 3001234567"
        class="form-input"
        [class.invalid]="phoneControl?.invalid && phoneControl?.touched">
      <span class="error-msg" *ngIf="phoneControl?.invalid && phoneControl?.touched">
        El teléfono es obligatorio (mínimo 7 dígitos).
      </span>
    </div>

    <button type="submit" class="btn-add">Agregar contacto</button>
  </form>
</section>
