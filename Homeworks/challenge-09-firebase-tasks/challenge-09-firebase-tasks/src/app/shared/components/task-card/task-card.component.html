<article
  class="card task-card"
  [class.task-card--completed]="task().completed"
  [class.task-card--editing]="editing()"
>
  <div class="card-body p-3 p-sm-4">
    <div class="d-flex gap-3">
      <div class="form-check pt-1">
        <input
          class="form-check-input task-check"
          type="checkbox"
          [id]="'task-' + task().id"
          [checked]="task().completed"
          [disabled]="busy()"
          [attr.aria-label]="task().completed ? 'Marcar como pendiente' : 'Marcar como completada'"
          (change)="onToggle($event)"
        />
      </div>

      <div class="flex-grow-1 min-w-0">
        <div class="d-flex flex-wrap align-items-start justify-content-between gap-2">
          <h3 class="task-card__title h6 mb-0">{{ task().title }}</h3>
          <span
            class="status-badge"
            [class.status-badge--completed]="task().completed"
            [class.status-badge--pending]="!task().completed"
          >
            {{ task().completed ? 'Completada' : 'Pendiente' }}
          </span>
        </div>

        @if (task().description) {
          <p class="task-card__description mt-2 mb-0">{{ task().description }}</p>
        }

        <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mt-3">
          <small class="text-secondary">
            <i class="bi bi-calendar3" aria-hidden="true"></i>
            Creada el {{ task().createdAt | date: 'd MMM y, h:mm a' }}
          </small>

          <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-outline-primary" [disabled]="busy()" (click)="edit.emit(task())">
              <i class="bi bi-pencil" aria-hidden="true"></i> Editar
            </button>
            <button type="button" class="btn btn-sm btn-outline-danger" [disabled]="busy()" (click)="remove.emit(task())">
              <i class="bi bi-trash3" aria-hidden="true"></i> Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</article>
